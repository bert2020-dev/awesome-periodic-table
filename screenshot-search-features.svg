<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1000" height="560" fill="#0b1120"/>
<text x="28" y="32" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">INLINE AUTOCOMPLETE</text>
<rect x="28" y="46" width="440" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="46" y="79" font-size="20" fill="#f1f5f9">va</text>
<rect x="68" y="58" width="98" height="28" fill="rgba(56,189,248,0.38)"/>
<text x="68" y="79" font-size="20" fill="#f1f5f9">nadium</text>
<text x="28" y="124" font-size="13" fill="#94a3b8">Type <tspan fill="#e2e8f0" font-weight="600">two letters</tspan>, get the rest as a selected "ghost" —</text>
<text x="28" y="144" font-size="13" fill="#94a3b8"><tspan fill="#fbbf24" font-weight="600">Tab</tspan> / <tspan fill="#fbbf24" font-weight="600">Enter</tspan> accepts · <tspan fill="#fbbf24" font-weight="600">Backspace</tspan> undoes cleanly · <tspan fill="#fbbf24" font-weight="600">Space</tspan> cancels</text>
<text x="28" y="200" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">EDIT ANYWHERE IN THE QUERY</text>
<rect x="28" y="214" width="620" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="46" y="247" font-size="17" fill="#f1f5f9">boils above 4000k and <tspan fill="#38bdf8" font-weight="700">solid below 3000f and </tspan>not radioactive</text>
<rect x="251" y="224" width="2" height="32" fill="#fbbf24"/>
<text x="28" y="292" font-size="13" fill="#94a3b8">Insert a correction in the middle of an existing query — each new word still gets suggestions.</text>
<text x="28" y="340" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">BASH-STYLE HISTORY</text>
<rect x="28" y="354" width="92" height="40" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="42" y="380" font-size="17" fill="#f1f5f9">📖</text>
<text x="68" y="379" font-size="14" font-weight="700" fill="#fbbf24">2/12</text>
<rect x="128" y="346" width="360" height="86" rx="8" fill="#0f172a" stroke="#334155"/>
<text x="140" y="366" font-size="12" fill="#e2e8f0" font-weight="600">Search history: entry 2 of 12</text>
<text x="140" y="384" font-size="11" fill="#94a3b8">↑/↓ browse · Ctrl+R history search</text>
<text x="140" y="400" font-size="11" fill="#94a3b8">Shift+Del delete entry</text>
<text x="140" y="416" font-size="11" fill="#94a3b8">Hold 2.2s to clear all</text>
<text x="28" y="464" font-size="12" fill="#94a3b8">Hold to clear:</text>
<rect x="138" y="444" width="92" height="40" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5" clip-path="url(#btnclip)"/>
<defs><clipPath id="btnclip"><rect x="138" y="444" width="92" height="40" rx="8"/></clipPath></defs>
<rect x="138" y="460" width="92" height="24" fill="#dc2626" opacity="0.85" clip-path="url(#btnclip)"/>
<text x="152" y="470" font-size="17" fill="#f1f5f9">📖</text>
<text x="500" y="340" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">REVERSE-I-SEARCH (Ctrl+R)</text>
<rect x="500" y="354" width="440" height="40" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="514" y="380" font-size="15" fill="#f1f5f9">go</text>
<rect x="500" y="400" width="440" height="40" rx="8" fill="#1e293b" stroke="#fbbf24"/>
<text x="512" y="424" font-size="12" font-weight="700" fill="#fbbf24">(reverse-i-search)</text>
<text x="650" y="424" font-size="12" fill="#f1f5f9">density above <tspan fill="#fbbf24" font-weight="700">go</tspan>ld</text>
<text x="880" y="424" font-size="11" fill="#94a3b8" text-anchor="end">1/3</text>
</svg>