name: Build and test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Force the adapter to use the interpreter installed by setup-python.
    # On Windows, `py -3` can silently pick a different (newer) Python version.
    env:
      PYTHON: ${{ matrix.os == 'windows-latest' && 'python' || 'python3' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps for Arcager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vendor/Arcager/requirements-optional.txt
          python -m pip install brotli
      - name: Install dependencies
        run: npm install
      - name: Verify data contract
        run: npm run test:data
      - name: Verify UI contract
        run: npm run test:ui
      - name: Run search regressions
        run: npm run test:search
      - name: Run pipeline regressions
        run: npm run test:pipe
      - name: Run autocomplete regressions
        run: npm run test:autocomplete
      - name: Run multivalue regressions
        run: npm run test:multi
      - name: Run superlative regressions
        run: npm run test:superlatives
      - name: Run runtime regressions
        run: npm run test:runtime
      - name: Build plain and Arcager distributions
        run: npm run build:all
      - name: Verify build output
        run: npm run test:build
      - name: Verify Arcager build
        run: npm run test:arcager
      - name: Verify Arcager data bridge
        run: npm run test:arcager-data
      - name: Verify Arcager contract
        run: npm run test:contract
      - name: Package and integrity-check release ZIP
        run: npm run package:release
